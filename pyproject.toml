[project]
name = "kids-calendar"
version = "0.1.0"
description = "One-family calendar"
requires-python = ">=3.13"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = [
  "apps/calendar",
  "apps/intake",
  "apps/ideas",
  "apps/notifier",
  "libs/contracts",
  "libs/llm",
  "libs/hebrewcal",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "ruff>=0.11",
  "pyright[nodejs]>=1.1.400",
]

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["apps", "libs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["apps", "libs"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
include = ["apps", "libs"]
exclude = ["**/tests", "**/migrations", "**/node_modules", "**/.venv"]
