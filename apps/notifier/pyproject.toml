[project]
name = "notifier"
version = "0.1.0"
description = "Reminder delivery"
requires-python = ">=3.13"
dependencies = [
  "alembic>=1.14",
  "arq>=0.26",
  "asyncpg>=0.30",
  "contracts",
  "fastapi>=0.115",
  "httpx>=0.28",
  "pydantic-settings>=2.7",
  "redis>=5.2",
  "sqlalchemy[asyncio]>=2.0.36",
  "tzdata>=2025.2",
  "uvicorn>=0.34",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
contracts = { workspace = true }
