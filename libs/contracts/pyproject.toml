[project]
name = "contracts"
version = "0.1.0"
description = "Shared DTOs and event schemas"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.10"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
contracts = { workspace = true }
