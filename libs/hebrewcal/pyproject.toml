[project]
name = "hebrewcal"
version = "0.1.0"
description = "Israel Hebrew calendar wrapper around hdate"
requires-python = ">=3.13"
dependencies = ["hdate>=1.2.2,<2", "tzdata>=2025.2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
