[project]
name = "llm"
version = "0.1.0"
description = "Language model protocol and adapters"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.10", "httpx>=0.28"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
